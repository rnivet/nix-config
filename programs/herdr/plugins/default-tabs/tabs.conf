# Tab template for new workspaces, applied in order. Sourced by apply.sh.
#
#   tab <label> [--command <shell command>] [--if-git]
#
#   --command   typed into the tab's pane and submitted once the shell is ready
#   --if-git    skip the command when the workspace cwd is not a git work tree
#               (the tab is still created, left at a shell prompt)
#
# The first entry reuses the workspace's existing tab rather than adding one.
# Agents started this way are picked up by herdr's own agent detection, so no
# `herdr agent start` is needed.

tab claude --command claude
tab git    --command lazygit --if-git
tab shell
